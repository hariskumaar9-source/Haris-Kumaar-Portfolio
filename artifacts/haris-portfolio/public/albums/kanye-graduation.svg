<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b" />
      <stop offset="35%" stop-color="#8338ec" />
      <stop offset="70%" stop-color="#ff006e" />
      <stop offset="100%" stop-color="#ffbe0b" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffea00" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="300" height="300" fill="url(#grad-sky)" />
  <circle cx="210" cy="110" r="70" fill="url(#sun-glow)" />

  <!-- Murakami Cosmic Clouds & Ground -->
  <path d="M-10,230 Q40,190 90,210 T190,200 T290,215 L310,310 L-10,310 Z" fill="#240046" opacity="0.9" />
  <path d="M-10,250 Q60,220 130,235 T240,230 T310,245 L310,310 L-10,310 Z" fill="#10002b" />

  <!-- Stars -->
  <polygon points="40,50 44,58 52,60 46,66 48,74 40,70 32,74 34,66 28,60 36,58" fill="#ffbe0b" />
  <polygon points="120,30 123,36 130,37 125,42 127,48 120,45 113,48 115,42 110,37 117,36" fill="#ffffff" opacity="0.9" />
  <polygon points="260,60 262,65 268,66 264,70 265,75 260,72 255,75 256,70 252,66 258,65" fill="#ffd166" />
  <circle cx="80" cy="90" r="3" fill="#ffffff" />
  <circle cx="160" cy="70" r="2.5" fill="#ffffff" />
  <circle cx="270" cy="130" r="2" fill="#ffd166" />

  <!-- Iconic Graduation Dropout Bear in Flying Shutter Shades -->
  <g transform="translate(105, 105)">
    <!-- Ears -->
    <circle cx="20" cy="18" r="14" fill="#6f1d1b" stroke="#000" stroke-width="2.5" />
    <circle cx="20" cy="18" r="7" fill="#ff99c8" />
    <circle cx="70" cy="18" r="14" fill="#6f1d1b" stroke="#000" stroke-width="2.5" />
    <circle cx="70" cy="18" r="7" fill="#ff99c8" />

    <!-- Head -->
    <ellipse cx="45" cy="45" rx="36" ry="32" fill="#78290f" stroke="#000" stroke-width="3" />

    <!-- Shutter Shades Glasses -->
    <rect x="16" y="32" width="26" height="18" rx="4" fill="#ffffff" stroke="#000" stroke-width="2" />
    <rect x="48" y="32" width="26" height="18" rx="4" fill="#ffffff" stroke="#000" stroke-width="2" />
    <rect x="42" y="38" width="6" height="4" fill="#000" />
    <line x1="18" y1="36" x2="40" y2="36" stroke="#8338ec" stroke-width="1.5" />
    <line x1="18" y1="41" x2="40" y2="41" stroke="#8338ec" stroke-width="1.5" />
    <line x1="18" y1="46" x2="40" y2="46" stroke="#8338ec" stroke-width="1.5" />
    <line x1="50" y1="36" x2="72" y2="36" stroke="#8338ec" stroke-width="1.5" />
    <line x1="50" y1="41" x2="72" y2="41" stroke="#8338ec" stroke-width="1.5" />
    <line x1="50" y1="46" x2="72" y2="46" stroke="#8338ec" stroke-width="1.5" />

    <!-- Snout & Mouth -->
    <ellipse cx="45" cy="60" rx="14" ry="10" fill="#f4a261" stroke="#000" stroke-width="2" />
    <polygon points="45,55 41,59 49,59" fill="#000" />
    <path d="M41,63 Q45,67 49,63" fill="none" stroke="#000" stroke-width="2" />

    <!-- Graduation Robe Collar & Gold Chain -->
    <path d="M22,74 L45,92 L68,74 L80,105 L10,105 Z" fill="#9d4edd" stroke="#000" stroke-width="2.5" />
    <path d="M35,76 Q45,86 55,76" fill="none" stroke="#ffbe0b" stroke-width="3" />
    <polygon points="45,86 42,91 48,91" fill="#ffbe0b" />
  </g>

  <!-- Typography -->
  <rect x="0" y="0" width="300" height="34" fill="#000000" opacity="0.45" />
  <text x="14" y="24" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" letter-spacing="2">KANYE WEST</text>
  <text x="14" y="278" fill="#ffbe0b" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" letter-spacing="3">GRADUATION</text>

  <!-- Parental Advisory Explicit Lyrics Logo -->
  <rect x="222" y="252" width="66" height="36" fill="#ffffff" stroke="#000" stroke-width="1.5" rx="2" />
  <rect x="224" y="254" width="62" height="11" fill="#000000" />
  <text x="227" y="262.5" fill="#ffffff" font-family="Arial, sans-serif" font-size="6.5" font-weight="900" letter-spacing="0.5">PARENTAL</text>
  <text x="227" y="274" fill="#000000" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" letter-spacing="0.8">ADVISORY</text>
  <text x="227" y="283" fill="#000000" font-family="Arial, sans-serif" font-size="5" font-weight="bold">EXPLICIT CONTENT</text>

  <!-- Vinyl Groove Ring Overlay -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
  <circle cx="150" cy="150" r="146" fill="none" stroke="#000000" stroke-width="2" opacity="0.35" />
</svg>