<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="prison-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="45%" stop-color="#2d1c08" />
      <stop offset="75%" stop-color="#c67d0a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="bar-metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555" />
      <stop offset="50%" stop-color="#fff" />
      <stop offset="100%" stop-color="#222" />
    </linearGradient>
  </defs>

  <!-- Dark Prison / Street Dusk Background -->
  <rect width="300" height="300" fill="url(#prison-grad)" />

  <!-- Prison Bars Silhouettes -->
  <g opacity="0.45">
    <rect x="25" y="0" width="6" height="300" fill="url(#bar-metallic)" />
    <rect x="70" y="0" width="6" height="300" fill="url(#bar-metallic)" />
    <rect x="115" y="0" width="6" height="300" fill="url(#bar-metallic)" />
    <rect x="160" y="0" width="6" height="300" fill="url(#bar-metallic)" />
    <rect x="205" y="0" width="6" height="300" fill="url(#bar-metallic)" />
    <rect x="250" y="0" width="6" height="300" fill="url(#bar-metallic)" />
    <rect x="290" y="0" width="6" height="300" fill="url(#bar-metallic)" />
  </g>

  <!-- Akon Portrait Silhouette Behind Bars -->
  <g transform="translate(100, 70)">
    <!-- Shoulders & Tank Top -->
    <path d="M-20,150 L20,95 L80,95 L120,150 Z" fill="#0f0f0f" stroke="#ffd166" stroke-width="1" />
    <!-- Neck & Heavy Chain -->
    <rect x="35" y="70" width="30" height="30" fill="#1a140f" />
    <path d="M30,85 Q50,110 70,85" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" />
    <polygon points="50,110 42,125 58,125" fill="#ffd166" />
    <!-- Head -->
    <ellipse cx="50" cy="50" rx="32" ry="36" fill="#1c130c" />
    <ellipse cx="50" cy="46" rx="28" ry="32" fill="#2d1c0c" />
    <!-- Facial Features Silhouette Highlight -->
    <path d="M44,48 Q50,56 56,48" fill="none" stroke="#ffd166" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="40" cy="42" rx="3" ry="1.5" fill="#ffd166" opacity="0.9" />
    <ellipse cx="60" cy="42" rx="3" ry="1.5" fill="#ffd166" opacity="0.9" />
    <!-- Beanie Hat -->
    <path d="M20,38 Q50,10 80,38 Z" fill="#000000" stroke="#333" stroke-width="1.5" />
  </g>

  <!-- Konvict Muzik Prison Bar Stamp -->
  <rect x="18" y="18" width="120" height="28" fill="#000" stroke="#ffd166" stroke-width="1.5" />
  <text x="25" y="37" fill="#ffd166" font-family="'Impact', Arial, sans-serif" font-size="14" letter-spacing="2">KONVICT MUZIK</text>

  <!-- Title & Snoop Dogg Credit -->
  <text x="18" y="235" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="4">AKON</text>
  <text x="20" y="260" fill="#ffd166" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3">KONVICTED</text>
  <text x="20" y="278" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">FEATURING SNOOP DOGG · I WANNA FUCK / LOVE YOU</text>

  <!-- Parental Advisory -->
  <rect x="222" y="248" width="66" height="36" fill="#ffffff" stroke="#000" stroke-width="1.5" rx="2" />
  <rect x="224" y="250" width="62" height="11" fill="#000000" />
  <text x="227" y="258.5" fill="#ffffff" font-family="Arial, sans-serif" font-size="6.5" font-weight="900">PARENTAL</text>
  <text x="227" y="270" fill="#000000" font-family="Arial, sans-serif" font-size="8.5" font-weight="900">ADVISORY</text>
  <text x="227" y="279" fill="#000000" font-family="Arial, sans-serif" font-size="5" font-weight="bold">EXPLICIT CONTENT</text>
</svg>