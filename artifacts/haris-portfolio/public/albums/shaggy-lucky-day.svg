<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tropical-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="40%" stop-color="#ff7b00" />
      <stop offset="80%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
  </defs>

  <!-- Tropical Vibrant Background -->
  <rect width="300" height="300" fill="url(#tropical-grad)" />

  <!-- Tropical Palm Tree Silhouettes -->
  <g fill="#1a1a1a">
    <!-- Palm Trunk Left -->
    <path d="M-10,300 Q40,180 50,70 Q40,180 0,300 Z" />
    <!-- Fronds -->
    <path d="M50,70 Q20,30 -20,45 Q15,45 50,70 Z" />
    <path d="M50,70 Q50,20 10,10 Q35,30 50,70 Z" />
    <path d="M50,70 Q80,25 110,40 Q75,45 50,70 Z" />
    <path d="M50,70 Q85,60 120,80 Q80,75 50,70 Z" />
  </g>

  <!-- Vintage 2000s Boombox Silhouette -->
  <g transform="translate(75, 80)">
    <rect width="150" height="95" rx="8" fill="#111" stroke="#ffd166" stroke-width="2.5" />
    <!-- Handle -->
    <path d="M30,0 L120,0 L120,-15 L30,-15 Z" fill="none" stroke="#ffd166" stroke-width="4" stroke-linejoin="round" />
    <!-- Left Speaker -->
    <circle cx="40" cy="50" r="28" fill="#222" stroke="#ff007f" stroke-width="2.5" />
    <circle cx="40" cy="50" r="10" fill="#ffd166" />
    <!-- Right Speaker -->
    <circle cx="110" cy="50" r="28" fill="#222" stroke="#ff007f" stroke-width="2.5" />
    <circle cx="110" cy="50" r="10" fill="#ffd166" />
    <!-- Center Cassette Deck -->
    <rect x="68" y="35" width="14" height="28" fill="#00f5d4" stroke="#000" stroke-width="1" />
  </g>

  <!-- Gold Starburst -->
  <polygon points="260,40 264,52 276,54 267,62 270,74 260,67 250,74 253,62 244,54 256,52" fill="#ffffff" stroke="#ff007f" stroke-width="1.5" />

  <!-- Typography -->
  <rect x="0" y="210" width="300" height="90" fill="#000000" opacity="0.9" />
  <text x="18" y="242" fill="#ffea00" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" letter-spacing="4">SHAGGY</text>
  <text x="150" y="240" fill="#00f5d4" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">LUCKY DAY</text>
  <text x="18" y="265" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="14" letter-spacing="1">HEY SEXY LADY</text>
  <text x="18" y="285" fill="#ff7b00" font-family="Arial, sans-serif" font-size="9" font-weight="bold">FEATURING BRIAN &amp; TONY GOLD · ORIGINAL 2002 MCA RECORDS</text>
</svg>