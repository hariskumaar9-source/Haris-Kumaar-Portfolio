<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <pattern id="hazard-stripes" width="24" height="24" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#ffcc00" stroke-width="12" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#111111" stroke-width="12" />
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#111111" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <rect width="300" height="300" fill="#0d0d0d" />
  <rect x="10" y="10" width="280" height="280" fill="none" stroke="url(#hazard-stripes)" stroke-width="14" />
  <rect x="18" y="18" width="264" height="264" fill="none" stroke="#000000" stroke-width="3" />
  <rect x="20" y="20" width="260" height="260" fill="#141414" />

  <g transform="translate(150, 130)">
    <circle cx="0" cy="0" r="64" fill="#ffcc00" stroke="#000000" stroke-width="4" />
    <path d="M0,0 L0,-64 A64,64 0 0,1 64,0 Z" fill="#111111" />
    <path d="M0,0 L0,64 A64,64 0 0,1 -64,0 Z" fill="#111111" />
    <line x1="-68" y1="0" x2="68" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-68" x2="0" y2="68" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#ffcc00" />
  </g>

  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="#ffcc00" stroke="#000" stroke-width="2" />
    <text x="30" y="14" font-family="monospace, 'Courier New'" font-size="11" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="1">AWGE</text>
  </g>

  <g transform="translate(208, 34)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="#111" stroke="#ffcc00" stroke-width="1.5" />
    <text x="30" y="14" font-family="monospace, 'Courier New'" font-size="9" font-weight="800" fill="#ffcc00" text-anchor="middle">REV·2018</text>
  </g>

  <text x="150" y="218" font-family="monospace, Impact, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">A$AP ROCKY</text>
  <text x="150" y="242" font-family="monospace, Impact, sans-serif" font-size="22" font-weight="900" fill="#ffcc00" text-anchor="middle" letter-spacing="6">TESTING</text>
  <text x="150" y="258" font-family="monospace, sans-serif" font-size="8.5" font-weight="700" fill="#d8ee57" text-anchor="middle" letter-spacing="1">PRAISE THE LORD (DA SHINE) · FT. SKEPTA</text>

  <g transform="translate(32, 252)">
    <rect x="0" y="0" width="58" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="29" y="8" font-family="sans-serif" font-size="5" font-weight="900" fill="#000000" text-anchor="middle">PARENTAL</text>
    <text x="29" y="14" font-family="sans-serif" font-size="6" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">ADVISORY</text>
  </g>

  <g transform="translate(220, 252)">
    <rect x="0" y="0" width="48" height="18" rx="2" fill="#000000" stroke="#39e658" stroke-width="1.5" />
    <text x="24" y="12" font-family="monospace" font-size="7.5" font-weight="800" fill="#39e658" text-anchor="middle">ORIGINAL</text>
  </g>

  <rect width="300" height="300" fill="url(#vignette)" pointer-events="none" />
</svg>