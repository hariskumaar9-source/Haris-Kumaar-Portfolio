<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="vhs-glitch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0ca3" />
      <stop offset="40%" stop-color="#7209b7" />
      <stop offset="70%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>
    <radialGradient id="sun-retro" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="60%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#3a0ca3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- VHS 80s Synthwave Gradient -->
  <rect width="300" height="300" fill="url(#vhs-glitch)" />
  <circle cx="150" cy="150" r="85" fill="url(#sun-retro)" />

  <!-- Outrun Grid Perspective Horizon -->
  <g stroke="#4cc9f0" stroke-width="1.2" opacity="0.6">
    <line x1="0" y1="180" x2="300" y2="180" stroke="#f72585" stroke-width="2" />
    <line x1="0" y1="195" x2="300" y2="195" />
    <line x1="0" y1="215" x2="300" y2="215" />
    <line x1="0" y1="240" x2="300" y2="240" stroke-width="1.5" />
    <line x1="0" y1="275" x2="300" y2="275" stroke-width="2" />

    <line x1="150" y1="180" x2="20" y2="300" />
    <line x1="150" y1="180" x2="70" y2="300" />
    <line x1="150" y1="180" x2="110" y2="300" />
    <line x1="150" y1="180" x2="150" y2="300" />
    <line x1="150" y1="180" x2="190" y2="300" />
    <line x1="150" y1="180" x2="230" y2="300" />
    <line x1="150" y1="180" x2="280" y2="300" />
  </g>

  <!-- Analog Cassette Spool & Tape Ribbon Graphic -->
  <g transform="translate(85, 75)">
    <rect width="130" height="85" rx="6" fill="#111" stroke="#ffd166" stroke-width="2" />
    <circle cx="35" cy="42" r="16" fill="#333" stroke="#fff" stroke-width="2" />
    <circle cx="35" cy="42" r="5" fill="#ffd166" />
    <circle cx="95" cy="42" r="16" fill="#333" stroke="#fff" stroke-width="2" />
    <circle cx="95" cy="42" r="5" fill="#ffd166" />
    <rect x="42" y="32" width="46" height="20" fill="#222" stroke="#4cc9f0" stroke-width="1" />
  </g>

  <!-- VHS Tracking Static Lines -->
  <line x1="0" y1="40" x2="300" y2="40" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
  <line x1="0" y1="110" x2="300" y2="110" stroke="#4cc9f0" stroke-width="0.8" opacity="0.3" />
  <line x1="0" y1="260" x2="300" y2="260" stroke="#ffffff" stroke-width="1" opacity="0.5" />

  <!-- Typography -->
  <rect x="15" y="15" width="130" height="24" fill="#000" />
  <text x="20" y="31" fill="#4cc9f0" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">▶ PLAY · 0:00:00</text>

  <text x="18" y="215" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="22" letter-spacing="2">TOMMY RICHMAN</text>
  <text x="18" y="240" fill="#ffd166" font-family="'Arial Black', sans-serif" font-size="14" letter-spacing="2">MILLION DOLLAR BABY</text>
  <text x="18" y="258" fill="#f72585" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">ALBUM: COYOTE · ISO-400 ANALOG MASTER</text>
</svg>