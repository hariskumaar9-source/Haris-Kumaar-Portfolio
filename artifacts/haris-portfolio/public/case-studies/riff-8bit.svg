<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#1a0c1e;image-rendering:pixelated;">
  <rect x="0" y="0" width="400" height="240" fill="#1a0c1e" />
  <rect x="8" y="8" width="384" height="224" fill="#100514" rx="4" stroke="#e0aaff" stroke-width="2" />
  <rect x="10" y="10" width="380" height="18" fill="#c77dff" />
