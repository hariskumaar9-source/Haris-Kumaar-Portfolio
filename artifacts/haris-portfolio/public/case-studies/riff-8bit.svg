  <!-- Synthesizer and Audio equalizer -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="340" height="155" fill="#240046" stroke="#7b2cbf" stroke-width="1.5" />
    <text x="20" y="28" fill="#e0aaff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">> CREATE MUSIC THAT SUITS YOUR VIBE</text>

