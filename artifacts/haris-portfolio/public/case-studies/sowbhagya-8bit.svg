<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#141210;image-rendering:pixelated;">
  <defs>
    <pattern id="pixel-grid3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="240" fill="#141210" />
  <rect x="8" y="8" width="384" height="224" fill="#0d0b09" rx="4" stroke="#d4af37" stroke-width="2" />

  <!-- Pixel Mac Window Header -->
  <rect x="10" y="10" width="380" height="18" fill="#d4af37" />
  <rect x="14" y="14" width="8" height="8" fill="#111" />
  <text x="30" y="23" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900" letter-spacing="1">SOWBHAGYA_LIVORA // LUXURY INTERIORS</text>
  <rect x="366" y="14" width="8" height="8" fill="#111" />
  <rect x="378" y="14" width="8" height="8" fill="#111" />

  <!-- Left Editorial Typography & Info -->
  <rect x="20" y="36" width="170" height="180" fill="#1a1714" stroke="#332d26" stroke-width="1.5" />
  <text x="30" y="56" fill="#d4af37" font-family="'Times New Roman', serif" font-size="16" font-style="italic" letter-spacing="1">Sowbhagya Livora</text>
  <text x="30" y="74" fill="#f5f0eb" font-family="'Courier New', monospace" font-size="10" font-weight="bold">> SPACES THAT REFLECT</text>
  <text x="30" y="88" fill="#aaa" font-family="'Courier New', monospace" font-size="8">Editorial brand direction for</text>
  <text x="30" y="98" fill="#aaa" font-family="'Courier New', monospace" font-size="8">high-end residential spaces.</text>

  <rect x="30" y="112" width="150" height="1" fill="#d4af37" opacity="0.4" />

  <text x="30" y="130" fill="#d4af37" font-family="'Courier New', monospace" font-size="9" font-weight="bold">● STATUS: BRAND CONCEPT</text>
  <text x="30" y="146" fill="#eee" font-family="'Courier New', monospace" font-size="8">CLIENT: Livora Interiors</text>
  <text x="30" y="160" fill="#eee" font-family="'Courier New', monospace" font-size="8">DISCIPLINE: Luxury UI Design</text>
  <text x="30" y="174" fill="#eee" font-family="'Courier New', monospace" font-size="8">ROLE: Visual &amp; Art Direction</text>

  <rect x="30" y="186" width="80" height="18" fill="#d4af37" />
  <text x="36" y="198" fill="#111" font-family="'Courier New', monospace" font-size="8" font-weight="bold">HIGH-END UX</text>

  <!-- Right: 8-Bit Pixel Architectural Room -->
  <g transform="translate(200, 36)">
    <!-- Room Background -->
    <rect x="0" y="0" width="180" height="180" fill="#24201b" stroke="#d4af37" stroke-width="1.5" />

    <!-- 8-Bit Architectural Archway on wall -->
    <rect x="25" y="10" width="70" height="6" fill="#3a342c" />
    <rect x="20" y="16" width="80" height="6" fill="#3a342c" />
    <rect x="15" y="22" width="90" height="6" fill="#3a342c" />
    <rect x="12" y="28" width="96" height="80" fill="#2d2822" stroke="#d4af37" stroke-width="1" />

    <!-- Sun flare / Warm Lighting through window -->
    <polygon points="12,28 108,28 150,140 0,140" fill="#d4af37" opacity="0.15" />

    <!-- Floor (pixel wooden planks) -->
    <rect x="0" y="125" width="180" height="55" fill="#1a1713" />
    <line x1="0" y1="135" x2="180" y2="135" stroke="#2b251f" stroke-width="1" />
    <line x1="0" y1="145" x2="180" y2="145" stroke="#2b251f" stroke-width="1" />
    <line x1="0" y1="155" x2="180" y2="155" stroke="#2b251f" stroke-width="1" />
    <line x1="0" y1="165" x2="180" y2="165" stroke="#2b251f" stroke-width="1" />

    <!-- 8-Bit Minimalist Luxury Couch -->
    <rect x="20" y="110" width="95" height="24" fill="#e8dfd8" stroke="#000" stroke-width="1" />
    <rect x="15" y="102" width="15" height="32" fill="#d6cac0" stroke="#000" stroke-width="1" />
    <rect x="105" y="102" width="15" height="32" fill="#d6cac0" stroke="#000" stroke-width="1" />
    <rect x="25" y="134" width="6" height="8" fill="#111" />
    <rect x="99" y="134" width="6" height="8" fill="#111" />

    <!-- Designer Coffee Table -->
    <rect x="50" y="140" width="45" height="8" fill="#000" stroke="#d4af37" stroke-width="1" />
    <rect x="56" y="148" width="4" height="8" fill="#d4af37" />
    <rect x="85" y="148" width="4" height="8" fill="#d4af37" />

    <!-- Potted Plant on right -->
    <rect x="145" y="115" width="20" height="26" fill="#8d5b4c" stroke="#000" stroke-width="1" />
    <rect x="150" y="90" width="10" height="25" fill="#386641" />
    <circle cx="152" cy="85" r="8" fill="#6a994e" />
    <circle cx="160" cy="95" r="7" fill="#6a994e" />
    <circle cx="145" cy="100" r="6" fill="#6a994e" />
  </g>

  <rect x="0" y="0" width="400" height="240" fill="url(#pixel-grid3)" pointer-events="none" />
</svg>
