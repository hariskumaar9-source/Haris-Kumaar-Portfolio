<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0c0919;image-rendering:pixelated;">
  <defs>
    <pattern id="pixel-grid-astro" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Monitor Chassis / Cosmic Background -->
  <rect x="0" y="0" width="400" height="240" fill="#0d091e" />
  <rect x="8" y="8" width="384" height="224" fill="#090616" rx="4" stroke="#ffb703" stroke-width="2" />

  <!-- Pixel Mac OS Window Header -->
  <rect x="10" y="10" width="380" height="18" fill="#ffb703" />
  <rect x="14" y="14" width="8" height="8" fill="#090616" />
  <text x="30" y="23" fill="#090616" font-family="'Courier New', monospace" font-size="9.5" font-weight="900" letter-spacing="0.5">AVR_PREDICTIVE_FORUM [ANCIENT WISDOM // AVRS SYSTEM]</text>
  <rect x="366" y="14" width="8" height="8" fill="#090616" />
  <rect x="378" y="14" width="8" height="8" fill="#090616" />

  <!-- Left: 8-Bit Vedic Horoscope Chart & Planetary Nodes -->
  <rect x="16" y="34" width="186" height="122" fill="#130d28" stroke="#3c1e68" stroke-width="1.5" />

  <!-- Traditional 12-House Vedic Chart Matrix -->
  <g transform="translate(24, 40)">
    <!-- Outer Square Chart Box -->
    <rect x="0" y="0" width="80" height="80" fill="#0b071a" stroke="#ffb703" stroke-width="1.5" />
    <!-- 4 Inner Quadrant Division -->
    <line x1="0" y1="0" x2="80" y2="80" stroke="#c77dff" stroke-width="1" />
    <line x1="80" y1="0" x2="0" y2="80" stroke="#c77dff" stroke-width="1" />
    <polygon points="40,0 80,40 40,80 0,40" fill="none" stroke="#ffd166" stroke-width="1.5" />
    
    <!-- Central Lagna (1st House Ascendant) Node -->
    <rect x="34" y="34" width="12" height="12" fill="#ffb703" />
    <text x="37" y="43" fill="#000" font-family="'Courier New', monospace" font-size="7" font-weight="bold">ASC</text>

    <!-- Planetary Glyphs in Houses (Pixel Placement) -->
    <text x="36" y="18" fill="#ffd166" font-family="'Courier New', monospace" font-size="7" font-weight="bold">☉SUN</text>
    <text x="10" y="30" fill="#ffffff" font-family="'Courier New', monospace" font-size="7" font-weight="bold">☽MON</text>
    <text x="54" y="30" fill="#00d2ff" font-family="'Courier New', monospace" font-size="7" font-weight="bold">♃JUP</text>
    <text x="12" y="60" fill="#ff4d6d" font-family="'Courier New', monospace" font-size="7" font-weight="bold">♂MAR</text>
    <text x="54" y="60" fill="#39e658" font-family="'Courier New', monospace" font-size="7" font-weight="bold">☿MER</text>
    <text x="36" y="72" fill="#c77dff" font-family="'Courier New', monospace" font-size="7" font-weight="bold">♄SAT</text>
  </g>

  <!-- Cosmic Celestial Sphere & Planetary Orbits (Right of Vedic Chart) -->
  <g transform="translate(116, 40)">
    <!-- Concentric Celestial Orbit Rings -->
    <circle cx="38" cy="40" r="34" fill="none" stroke="#3c1e68" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="38" cy="40" r="22" fill="none" stroke="#7209b7" stroke-width="1" />
    <circle cx="38" cy="40" r="10" fill="none" stroke="#c77dff" stroke-width="1" stroke-dasharray="3,2" />
    
    <!-- Sun Center Glow -->
    <circle cx="38" cy="40" r="5" fill="#ffb703" />
    <!-- Orbiting Planet Nodes with Glow -->
    <circle cx="60" cy="40" r="3" fill="#00d2ff" />
    <circle cx="22" cy="28" r="2.5" fill="#39e658" />
    <circle cx="48" cy="68" r="3.5" fill="#ffd166" />
    <circle cx="16" cy="58" r="2" fill="#ff4d6d" />

    <!-- 8-Bit Twinkling Stars -->
    <rect x="4" y="6" width="2" height="2" fill="#ffffff" />
    <rect x="70" y="12" width="2" height="2" fill="#ffffff" />
    <rect x="68" y="70" width="2" height="2" fill="#ffd166" />
    <rect x="2" y="74" width="2" height="2" fill="#c77dff" />
  </g>

  <!-- Left Bottom Banner: Methodology Badge -->
  <rect x="22" y="126" width="174" height="24" fill="#090616" stroke="#ffb703" stroke-width="1" />
  <text x="26" y="136" fill="#ffd166" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">> AVRS PREDICTIVE SYSTEM</text>
  <text x="26" y="145" fill="#c77dff" font-family="'Courier New', monospace" font-size="7">K.P. METHOD + BOGAR NAADI TRADITION</text>

  <!-- Right: Platform Metrics & Impact Showcase -->
  <rect x="210" y="34" width="174" height="122" fill="#130d28" stroke="#ffb703" stroke-width="1.5" />
  <text x="218" y="49" fill="#ffb703" font-family="'Courier New', monospace" font-size="9.5" font-weight="900">> ACADEMY &amp; IMPACT</text>

  <!-- Metric Card 1: 1000+ Students -->
  <rect x="218" y="55" width="158" height="22" fill="#090616" stroke="#c77dff" stroke-width="1" />
  <text x="224" y="66" fill="#c77dff" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">TRAINED ASTROLOGERS</text>
  <text x="224" y="74" fill="#ffd166" font-family="'Courier New', monospace" font-size="8" font-weight="900">1,000+ Practitioners</text>

  <!-- Metric Card 2: 90% Professional Placement -->
  <rect x="218" y="82" width="158" height="22" fill="#090616" stroke="#00d2ff" stroke-width="1" />
  <text x="224" y="93" fill="#00d2ff" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">PROFESSIONAL CONSULTANTS</text>
  <text x="224" y="101" fill="#39e658" font-family="'Courier New', monospace" font-size="8" font-weight="900">90% Active Practices</text>

  <!-- Metric Card 3: Experience & Legacy -->
  <rect x="218" y="109" width="158" height="22" fill="#090616" stroke="#ffd166" stroke-width="1" />
  <text x="224" y="120" fill="#ffd166" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">EXPERTISE &amp; LEGACY</text>
  <text x="224" y="128" fill="#ffffff" font-family="'Courier New', monospace" font-size="8" font-weight="900">30+ Years Astrological Mastery</text>

  <rect x="218" y="135" width="158" height="15" fill="#3c1e68" />
  <text x="224" y="145" fill="#ffd166" font-family="'Courier New', monospace" font-size="7" font-weight="bold">✓ TAMIL &amp; ENGLISH BILINGUAL UX</text>

  <!-- Bottom Terminal Command / Live Status Bar -->
  <rect x="16" y="162" width="368" height="62" fill="#130d28" stroke="#3c1e68" stroke-width="1.5" />
  
  <text x="24" y="176" fill="#00d2ff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">> PLATFORM STACK: Next.js · Bilingual Typography · Video Architecture · Course Portal</text>
  <text x="24" y="188" fill="#aaa" font-family="'Courier New', monospace" font-size="7.5">Structured planetary rules, horoscopic rectification visualizers, and online booking.</text>
  
  <!-- Status Chip & Live Link -->
  <rect x="24" y="196" width="168" height="20" fill="#090616" stroke="#39e658" stroke-width="1" />
  <circle cx="34" cy="206" r="3" fill="#39e658" />
  <text x="42" y="209" fill="#39e658" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">LIVE: AVRSATHISHKUMAR.IN</text>

  <!-- Course Enrollment Badge -->
  <rect x="198" y="196" width="178" height="20" fill="#ffb703" stroke="#000" stroke-width="1" />
  <text x="206" y="209" fill="#000" font-family="'Courier New', monospace" font-size="7.5" font-weight="900">CASE STUDY: PREDICTIVE ASTROLOGY</text>

  <!-- Pixel Scanlines -->
  <rect x="0" y="0" width="400" height="240" fill="url(#pixel-grid-astro)" pointer-events="none" />
</svg>