<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0f1a14;image-rendering:pixelated;">
  <defs>
    <pattern id="pixel-grid2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="240" fill="#0f1a14" />
  <rect x="8" y="8" width="384" height="224" fill="#0a120e" rx="4" stroke="#06d6a0" stroke-width="2" />

  <!-- Pixel Mac Window Header -->
  <rect x="10" y="10" width="380" height="18" fill="#06d6a0" />
  <rect x="14" y="14" width="8" height="8" fill="#000" />
  <text x="30" y="23" fill="#000" font-family="'Courier New', monospace" font-size="10" font-weight="900" letter-spacing="1">SOLARIX_CLEANTECH_SYS // LIVE WEBSITE</text>
  <rect x="366" y="14" width="8" height="8" fill="#000" />
  <rect x="378" y="14" width="8" height="8" fill="#000" />

  <!-- 8-Bit Pixel Sun (Top Right) -->
  <g transform="translate(300, 35)">
    <!-- Sun rays (pixels) -->
    <rect x="24" y="0" width="8" height="6" fill="#ffd166" />
    <rect x="24" y="50" width="8" height="6" fill="#ffd166" />
    <rect x="0" y="24" width="6" height="8" fill="#ffd166" />
    <rect x="50" y="24" width="6" height="8" fill="#ffd166" />
    <rect x="8" y="8" width="6" height="6" fill="#ffd166" />
    <rect x="42" y="8" width="6" height="6" fill="#ffd166" />
    <rect x="8" y="42" width="6" height="6" fill="#ffd166" />
    <rect x="42" y="42" width="6" height="6" fill="#ffd166" />
    <!-- Sun core -->
    <rect x="12" y="12" width="32" height="32" fill="#ffb703" />
    <rect x="16" y="16" width="24" height="24" fill="#ffd166" />
    <!-- 8-bit shades/sunglasses -->
    <rect x="18" y="24" width="8" height="6" fill="#000" />
    <rect x="30" y="24" width="8" height="6" fill="#000" />
    <rect x="26" y="26" width="4" height="2" fill="#000" />
  </g>

  <!-- Left Content Info: "Let The Sun Pay your Bill" -->
  <rect x="22" y="36" width="260" height="74" fill="#13241b" stroke="#06d6a0" stroke-dasharray="3,3" />
  <text x="32" y="54" fill="#ffd166" font-family="'Courier New', monospace" font-size="11" font-weight="bold">"LET THE SUN PAY YOUR BILL"</text>
  <text x="32" y="70" fill="#06d6a0" font-family="'Courier New', monospace" font-size="13" font-weight="900">> SWITCH TO SOLAR ENERGY</text>
  <text x="32" y="86" fill="#aaa" font-family="'Courier New', monospace" font-size="9">Cut electricity costs by up to 90%</text>
  <text x="32" y="100" fill="#06d6a0" font-family="'Courier New', monospace" font-size="9" font-weight="bold">● 20+ Happy Families Onboarded</text>

  <!-- 8-Bit Pixel House with Solar Roof -->
  <g transform="translate(40, 118)">
    <!-- Roof Triangle (pixel steps) -->
    <rect x="70" y="0" width="20" height="6" fill="#264653" />
    <rect x="58" y="6" width="44" height="6" fill="#264653" />
    <rect x="46" y="12" width="68" height="6" fill="#264653" />
    <rect x="34" y="18" width="92" height="6" fill="#264653" />
    <rect x="22" y="24" width="116" height="6" fill="#264653" />
    <rect x="10" y="30" width="140" height="6" fill="#264653" />

    <!-- 8-bit Solar Panel cells on roof -->
    <rect x="30" y="20" width="18" height="12" fill="#118ab2" stroke="#06d6a0" stroke-width="1" />
    <rect x="52" y="14" width="18" height="12" fill="#118ab2" stroke="#06d6a0" stroke-width="1" />
    <rect x="74" y="14" width="18" height="12" fill="#118ab2" stroke="#06d6a0" stroke-width="1" />
    <rect x="96" y="20" width="18" height="12" fill="#118ab2" stroke="#06d6a0" stroke-width="1" />

    <!-- House Body -->
    <rect x="20" y="36" width="120" height="60" fill="#2a3f35" stroke="#06d6a0" stroke-width="1.5" />
    <!-- Door -->
    <rect x="70" y="60" width="20" height="36" fill="#13241b" stroke="#ffd166" stroke-width="1" />
    <circle cx="75" cy="78" r="2" fill="#ffd166" />
    <!-- Windows -->
    <rect x="34" y="50" width="22" height="22" fill="#ffd166" stroke="#000" stroke-width="2" />
    <rect x="94" y="50" width="22" height="22" fill="#ffd166" stroke="#000" stroke-width="2" />
  </g>

  <!-- Power Meter / Battery Battery Widget (Right side) -->
  <rect x="210" y="120" width="170" height="98" fill="#13241b" stroke="#06d6a0" stroke-width="1.5" />
  <text x="220" y="138" fill="#06d6a0" font-family="'Courier New', monospace" font-size="10" font-weight="bold">> ECO GRID METRICS</text>

  <rect x="220" y="146" width="150" height="12" fill="#0a120e" stroke="#2a3f35" />
  <rect x="220" y="146" width="135" height="12" fill="#06d6a0" />
  <text x="225" y="155" fill="#000" font-family="'Courier New', monospace" font-size="8" font-weight="bold">CLEAN ENERGY: 90%</text>

  <text x="220" y="174" fill="#ffd166" font-family="'Courier New', monospace" font-size="9">CLIENT: Solarix Solutions</text>
  <text x="220" y="188" fill="#aaa" font-family="'Courier New', monospace" font-size="8">ROLE: Lead UI/UX &amp; IA</text>
  <text x="220" y="202" fill="#06d6a0" font-family="'Courier New', monospace" font-size="8" font-weight="bold">IMPACT: +45% Inquiries</text>

  <rect x="0" y="0" width="400" height="240" fill="url(#pixel-grid2)" pointer-events="none" />
</svg>
