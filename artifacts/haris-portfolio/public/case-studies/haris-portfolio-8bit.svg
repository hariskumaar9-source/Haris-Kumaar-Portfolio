<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0f111a;image-rendering:pixelated;">
  <defs>
    <pattern id="pixel-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- CRT Monitor Chassis & Retro Frame -->
  <rect x="0" y="0" width="400" height="240" fill="#151722" />
  <rect x="8" y="8" width="384" height="224" fill="#0c0e14" rx="4" stroke="#d8ee57" stroke-width="2" />

  <!-- Mac OS 7.5 Window Titlebar Header -->
  <rect x="10" y="10" width="380" height="18" fill="#d8ee57" />
  <rect x="14" y="14" width="8" height="8" fill="#111" />
  <text x="30" y="23" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900" letter-spacing="1">HARIS_OS_1984 [MOCKINTOSH PARODY · LIVE WEBOS]</text>
  <rect x="366" y="14" width="8" height="8" fill="#111" />
  <rect x="378" y="14" width="8" height="8" fill="#111" />

  <!-- Left: Physical 1984 Macintosh CRT Computer Illustration -->
  <rect x="16" y="34" width="180" height="124" fill="#1a1c24" stroke="#33384a" stroke-width="2" />
  <!-- Bezel Casing -->
  <rect x="28" y="42" width="156" height="108" fill="#d4cebe" stroke="#111" stroke-width="2" rx="3" />
  <!-- Top Vent Slats -->
  <rect x="42" y="46" width="30" height="3" fill="#a09a8a" />
  <rect x="140" y="46" width="30" height="3" fill="#a09a8a" />
  <!-- CRT Screen Aperture -->
  <rect x="38" y="54" width="136" height="74" fill="#000" stroke="#333" stroke-width="2" rx="2" />
  <!-- Screen Desktop Content -->
  <rect x="40" y="56" width="132" height="10" fill="#ededed" />
  <text x="44" y="64" fill="#000" font-family="'Courier New', monospace" font-size="7" font-weight="bold"> File Edit View Special</text>
  <!-- Mini Desktop Icons -->
  <rect x="44" y="70" width="8" height="8" fill="#d8ee57" stroke="#111" stroke-width="1" />
  <rect x="44" y="82" width="8" height="8" fill="#ffd166" stroke="#111" stroke-width="1" />
  <rect x="44" y="94" width="8" height="8" fill="#ff6b6b" stroke="#111" stroke-width="1" />
  <rect x="44" y="106" width="8" height="8" fill="#39e658" stroke="#111" stroke-width="1" />
  <!-- Mini Active Mac Window -->
  <rect x="62" y="70" width="104" height="46" fill="#fff" stroke="#111" stroke-width="1.5" />
  <rect x="62" y="70" width="104" height="8" fill="#222" />
  <text x="66" y="76" fill="#d8ee57" font-family="'Courier New', monospace" font-size="6" font-weight="bold">DeviceAI.agent — Active</text>
  <text x="66" y="86" fill="#111" font-family="'Courier New', monospace" font-size="6" font-weight="bold">> SENSING VIEWPORT: OK</text>
  <text x="66" y="94" fill="#111" font-family="'Courier New', monospace" font-size="6" font-weight="bold">> AUDIO: FLASHING LIGHTS MP3</text>
  <text x="66" y="102" fill="#38a169" font-family="'Courier New', monospace" font-size="6" font-weight="bold">> 100% RESPONSIVE ENGINE</text>
  <!-- Floppy slot & Rainbow Emblem -->
  <rect x="136" y="134" width="38" height="4" fill="#444" />
  <rect x="36" y="133" width="6" height="8" fill="#61bb46" />

  <!-- Right: Architecture & Evolutionary Perks Panel -->
  <rect x="204" y="34" width="180" height="124" fill="#141724" stroke="#33384a" stroke-width="2" />
  <rect x="204" y="34" width="180" height="18" fill="#242b3d" />
  <text x="210" y="47" fill="#d8ee57" font-family="'Courier New', monospace" font-size="9" font-weight="bold">SYSTEM PERKS &amp; INNOVATIONS</text>

  <!-- Metric 1: Audio Engine -->
  <rect x="210" y="58" width="80" height="30" fill="#1b2133" stroke="#d8ee57" stroke-width="1" />
  <text x="214" y="69" fill="#d8ee57" font-family="'Courier New', monospace" font-size="7">AUDIO ENGINE</text>
  <text x="214" y="82" fill="#fff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">Studio MP3</text>

  <!-- Metric 2: Responsiveness -->
  <rect x="296" y="58" width="82" height="30" fill="#1b2133" stroke="#39e658" stroke-width="1" />
  <text x="300" y="69" fill="#39e658" font-family="'Courier New', monospace" font-size="7">ADAPTATION</text>
  <text x="300" y="82" fill="#fff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">All Devices</text>

  <!-- Metric 3: AI Specialist -->
  <rect x="210" y="94" width="80" height="30" fill="#1b2133" stroke="#ffd166" stroke-width="1" />
  <text x="214" y="105" fill="#ffd166" font-family="'Courier New', monospace" font-size="7">AI AGENT</text>
  <text x="214" y="118" fill="#fff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">Viewport AI</text>

  <!-- Metric 4: Edge Speed -->
  <rect x="296" y="94" width="82" height="30" fill="#1b2133" stroke="#ff6b6b" stroke-width="1" />
  <text x="300" y="105" fill="#ff6b6b" font-family="'Courier New', monospace" font-size="7">EDGE DEPLOY</text>
  <text x="300" y="118" fill="#fff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">&lt;50ms Global</text>

  <!-- Bottom Interactive Perks Banner -->
  <rect x="210" y="130" width="168" height="20" fill="#0d0f17" stroke="#33384a" stroke-width="1" />
  <text x="216" y="143" fill="#d8ee57" font-family="'Courier New', monospace" font-size="8" font-weight="bold">★ 1984 MAC · SLAM DUNK · JUKEBOX · GAME</text>

  <!-- Bottom Timeline Pill Ribbon -->
  <rect x="16" y="166" width="368" height="58" fill="#121520" stroke="#2a2e42" stroke-width="1.5" rx="3" />
  <text x="24" y="180" fill="#d8ee57" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold">EVOLUTIONARY TIMELINE (FROM BEGINNING UNTIL NOW):</text>
  
  <rect x="24" y="188" width="54" height="28" fill="#1e2235" stroke="#444a69" stroke-width="1" />
  <text x="28" y="198" fill="#aaa" font-family="'Courier New', monospace" font-size="6.5">PHASE 1</text>
  <text x="28" y="209" fill="#fff" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">Mac OS 7.5</text>

  <rect x="84" y="188" width="54" height="28" fill="#1e2235" stroke="#444a69" stroke-width="1" />
  <text x="88" y="198" fill="#aaa" font-family="'Courier New', monospace" font-size="6.5">PHASE 2</text>
  <text x="88" y="209" fill="#fff" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">CRT Bezel</text>

  <rect x="144" y="188" width="54" height="28" fill="#1e2235" stroke="#444a69" stroke-width="1" />
  <text x="148" y="198" fill="#aaa" font-family="'Courier New', monospace" font-size="6.5">PHASE 3</text>
  <text x="148" y="209" fill="#fff" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">Anime TV</text>

  <rect x="204" y="188" width="54" height="28" fill="#1e2235" stroke="#444a69" stroke-width="1" />
  <text x="208" y="198" fill="#aaa" font-family="'Courier New', monospace" font-size="6.5">PHASE 4</text>
  <text x="208" y="209" fill="#fff" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">Board Game</text>

  <rect x="264" y="188" width="58" height="28" fill="#1e2235" stroke="#444a69" stroke-width="1" />
  <text x="268" y="198" fill="#aaa" font-family="'Courier New', monospace" font-size="6.5">PHASE 5</text>
  <text x="268" y="209" fill="#d8ee57" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">Studio MP3</text>

  <rect x="328" y="188" width="50" height="28" fill="#1e2235" stroke="#39e658" stroke-width="1" />
  <text x="332" y="198" fill="#39e658" font-family="'Courier New', monospace" font-size="6.5">PHASE 6</text>
  <text x="332" y="209" fill="#39e658" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold">Device AI</text>
</svg>
