<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#0c1524;image-rendering:pixelated;">
  <defs>
    <pattern id="pixel-grid4" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="240" fill="#0c1524" />
  <rect x="8" y="8" width="384" height="224" fill="#070c17" rx="4" stroke="#00b4d8" stroke-width="2" />

  <!-- Pixel Mac Window Header -->
  <rect x="10" y="10" width="380" height="18" fill="#00b4d8" />
  <rect x="14" y="14" width="8" height="8" fill="#000" />
  <text x="30" y="23" fill="#000" font-family="'Courier New', monospace" font-size="10" font-weight="900" letter-spacing="1">HEALORA_AI_PHARMACY // HEALTH TECH</text>
  <rect x="366" y="14" width="8" height="8" fill="#000" />
  <rect x="378" y="14" width="8" height="8" fill="#000" />

  <!-- Left: Medical Tech UI & Stats -->
  <rect x="20" y="36" width="190" height="180" fill="#0f1f38" stroke="#1d3557" stroke-width="1.5" />
  <text x="30" y="54" fill="#00b4d8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">> HEALORA AI ECOSYSTEM</text>
  <text x="30" y="68" fill="#90e0ef" font-family="'Courier New', monospace" font-size="9">Intelligent prescription &amp; medicine discovery</text>

  <!-- Metric highlight box -->
  <rect x="30" y="78" width="170" height="44" fill="#070c17" stroke="#00f5d4" stroke-width="1.5" />
  <text x="38" y="94" fill="#00f5d4" font-family="'Courier New', monospace" font-size="9" font-weight="bold">ACHIEVED METRIC:</text>
  <text x="38" y="112" fill="#fff" font-family="'Courier New', monospace" font-size="15" font-weight="900">+40% CONVERSION</text>
  <text x="148" y="112" fill="#00f5d4" font-family="'Courier New', monospace" font-size="9">(45 Days)</text>

  <!-- Role & Project Details -->
  <text x="30" y="140" fill="#fff" font-family="'Courier New', monospace" font-size="8">CLIENT: Healora Healthcare</text>
  <text x="30" y="152" fill="#aaa" font-family="'Courier New', monospace" font-size="8">STATUS: Live Mobile &amp; Web Experience</text>
  <text x="30" y="164" fill="#aaa" font-family="'Courier New', monospace" font-size="8">SPECIALTY: Rural accessibility &amp; 1-click cart</text>

  <!-- Pill tags -->
  <rect x="30" y="178" width="76" height="16" fill="#00b4d8" />
  <text x="36" y="190" fill="#000" font-family="'Courier New', monospace" font-size="8" font-weight="bold">ECOMMERCE UX</text>

  <rect x="112" y="178" width="70" height="16" fill="#7209b7" />
  <text x="118" y="190" fill="#fff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">HEALTHCARE</text>

  <!-- Right: 8-Bit Pixel Pharmacy & Heartbeat Visualizer -->
  <g transform="translate(225, 36)">
    <rect x="0" y="0" width="155" height="180" fill="#0d1b2a" stroke="#00b4d8" stroke-width="1.5" />

    <!-- 8-Bit Pixel Medical Cross -->
    <g transform="translate(48, 16)">
      <!-- Red/Cyan glowing cross -->
      <rect x="20" y="0" width="20" height="60" fill="#00f5d4" stroke="#000" stroke-width="2" />
      <rect x="0" y="20" width="60" height="20" fill="#00f5d4" stroke="#000" stroke-width="2" />
      <!-- Inner core -->
      <rect x="24" y="4" width="12" height="52" fill="#fff" />
      <rect x="4" y="24" width="52" height="12" fill="#fff" />
    </g>

    <!-- 8-Bit Pixel Prescription Capsule / Pill -->
    <g transform="translate(32, 90)">
      <rect x="0" y="0" width="42" height="20" rx="10" fill="#ef476f" stroke="#000" stroke-width="1.5" />
      <rect x="42" y="0" width="42" height="20" rx="10" fill="#ffd166" stroke="#000" stroke-width="1.5" />
      <!-- Pill divider line -->
      <rect x="41" y="0" width="2" height="20" fill="#000" />
      <text x="10" y="14" fill="#fff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">Rx</text>
      <text x="48" y="14" fill="#000" font-family="'Courier New', monospace" font-size="8" font-weight="bold">AI</text>
    </g>

    <!-- 8-Bit ECG / Heartbeat Graph (Green pixel wave) -->
    <rect x="10" y="125" width="135" height="42" fill="#070c17" stroke="#00f5d4" stroke-width="1" />
    <polyline points="15,146 35,146 45,133 55,158 65,138 75,146 100,146 110,131 120,152 130,146" 
      fill="none" stroke="#00f5d4" stroke-width="2" stroke-linecap="square" />
  </g>

  <rect x="0" y="0" width="400" height="240" fill="url(#pixel-grid4)" pointer-events="none" />
</svg>
