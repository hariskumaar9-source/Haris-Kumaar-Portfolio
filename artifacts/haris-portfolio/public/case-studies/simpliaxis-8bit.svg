<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#111116;image-rendering:pixelated;">
  <defs>
    <pattern id="pixel-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- CRT scanline & retro monitor frame -->
  <rect x="0" y="0" width="400" height="240" fill="#181824" />
  <rect x="8" y="8" width="384" height="224" fill="#0d0d14" rx="4" stroke="#ffcc00" stroke-width="2" />

  <!-- Pixel Mac OS Window Header -->
  <rect x="10" y="10" width="380" height="18" fill="#ffcc00" />
  <rect x="14" y="14" width="8" height="8" fill="#111" />
  <text x="30" y="23" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900" letter-spacing="1">SIMPLIAXIS_LMS_v2.0 [LIVE]</text>
  <rect x="366" y="14" width="8" height="8" fill="#111" />
  <rect x="378" y="14" width="8" height="8" fill="#111" />

  <!-- Left Sidebar (8-bit navigation) -->
  <rect x="16" y="34" width="60" height="190" fill="#1e1e2d" stroke="#2c2c40" stroke-width="2" />
  <!-- Avatar pixel block -->
  <rect x="28" y="44" width="36" height="36" fill="#383852" />
  <rect x="38" y="50" width="16" height="14" fill="#ffd166" />
  <rect x="34" y="64" width="24" height="12" fill="#06d6a0" />
  <!-- Nav items -->
  <rect x="22" y="92" width="48" height="8" fill="#ffcc00" />
  <rect x="22" y="106" width="40" height="6" fill="#666688" />
  <rect x="22" y="118" width="44" height="6" fill="#666688" />
  <rect x="22" y="130" width="36" height="6" fill="#666688" />
  <rect x="22" y="142" width="42" height="6" fill="#666688" />

  <!-- Main LMS Content Area -->
  <!-- Top Banner (October Offer / Welcome) -->
  <rect x="84" y="34" width="220" height="42" fill="#252538" stroke="#ffcc00" stroke-dasharray="4,4" />
  <text x="94" y="52" fill="#06d6a0" font-family="'Courier New', monospace" font-size="10" font-weight="bold">> WELCOME BACK, LEARNER!</text>
  <text x="94" y="66" fill="#ffd166" font-family="'Courier New', monospace" font-size="9">PMP CERTIFICATION: 78% READY</text>

  <!-- Metric Cards (8-bit widgets) -->
  <rect x="84" y="82" width="68" height="46" fill="#1a2e26" stroke="#06d6a0" stroke-width="1.5" />
  <text x="90" y="96" fill="#06d6a0" font-family="'Courier New', monospace" font-size="8">STUDENTS</text>
  <text x="90" y="116" fill="#fff" font-family="'Courier New', monospace" font-size="16" font-weight="bold">1,200+</text>

  <rect x="160" y="82" width="68" height="46" fill="#2e261a" stroke="#ffd166" stroke-width="1.5" />
  <text x="166" y="96" fill="#ffd166" font-family="'Courier New', monospace" font-size="8">TESTS</text>
  <text x="166" y="116" fill="#fff" font-family="'Courier New', monospace" font-size="16" font-weight="bold">900+</text>

  <rect x="236" y="82" width="68" height="46" fill="#1a1e2e" stroke="#118ab2" stroke-width="1.5" />
  <text x="242" y="96" fill="#118ab2" font-family="'Courier New', monospace" font-size="8">RATING</text>
  <text x="242" y="116" fill="#fff" font-family="'Courier New', monospace" font-size="16" font-weight="bold">4.9 ★</text>

  <!-- Right Mobile Screen Preview (8-bit Phone) -->
  <rect x="312" y="34" width="72" height="136" fill="#000" rx="6" stroke="#888" stroke-width="2" />
  <rect x="316" y="44" width="64" height="116" fill="#111" />
  <rect x="322" y="52" width="52" height="12" fill="#06d6a0" />
  <rect x="322" y="70" width="40" height="4" fill="#ffd166" />
  <rect x="322" y="78" width="52" height="4" fill="#fff" />
  <rect x="322" y="86" width="30" height="4" fill="#888" />
  <rect x="322" y="98" width="52" height="24" fill="#252538" stroke="#06d6a0" stroke-width="1" />
  <circle cx="348" cy="166" r="3" fill="#666" />

  <!-- Bottom Interactive Track Record Bar -->
  <rect x="84" y="136" width="220" height="88" fill="#161622" stroke="#333" />
  <text x="94" y="152" fill="#fff" font-family="'Courier New', monospace" font-size="10" font-weight="bold">> PRACTICE TEST SIMULATOR</text>
  <!-- Progress bar -->
  <rect x="94" y="162" width="200" height="12" fill="#222" stroke="#444" />
  <rect x="94" y="162" width="156" height="12" fill="#06d6a0" />
  <text x="100" y="171" fill="#111" font-family="'Courier New', monospace" font-size="9" font-weight="bold">78% COMPLETE</text>
  <!-- Badges -->
  <rect x="94" y="184" width="70" height="16" fill="#ffcc00" />
  <text x="99" y="196" fill="#111" font-family="'Courier New', monospace" font-size="9" font-weight="bold">AI-ASSISTED</text>

  <rect x="172" y="184" width="74" height="16" fill="#118ab2" />
  <text x="177" y="196" fill="#fff" font-family="'Courier New', monospace" font-size="9" font-weight="bold">RESPONSIVE</text>

  <rect x="254" y="184" width="50" height="16" fill="#ef476f" />
  <text x="261" y="196" fill="#fff" font-family="'Courier New', monospace" font-size="9" font-weight="bold">WCAG</text>

  <!-- Scanlines overlay -->
  <rect x="0" y="0" width="400" height="240" fill="url(#pixel-grid)" pointer-events="none" />
</svg>
