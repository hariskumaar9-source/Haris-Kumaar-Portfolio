<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="background:#091e24;image-rendering:pixelated;">
  <rect x="0" y="0" width="400" height="240" fill="#091e24" />
  <rect x="8" y="8" width="384" height="224" fill="#040e12" rx="4" stroke="#00f5d4" stroke-width="2" />
  <rect x="10" y="10" width="380" height="18" fill="#00f5d4" />
  <text x="25" y="23" fill="#000" font-family="'Courier New', monospace" font-size="10" font-weight="900">DIGIXCARE // AI MEDICAL X-RAY DIAGNOSTICS [2023]</text>

  <!-- Left: Mobile phone mockup with X-ray screen -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="90" height="155" rx="12" fill="#000" stroke="#00f5d4" stroke-width="2" />
    <rect x="6" y="16" width="78" height="122" fill="#0a192f" />
    <!-- X-Ray chest ribs pixel graphic -->
    <g transform="translate(15, 30)">
      <line x1="24" y1="0" x2="24" y2="70" stroke="#fff" stroke-width="4" />
      <path d="M 10 15 Q 24 22 38 15" stroke="#00f5d4" stroke-width="3" fill="none" />
      <path d="M 6 30 Q 24 37 42 30" stroke="#00f5d4" stroke-width="3" fill="none" />
      <path d="M 8 45 Q 24 52 40 45" stroke="#00f5d4" stroke-width="3" fill="none" />
      <path d="M 12 60 Q 24 67 36 60" stroke="#00f5d4" stroke-width="3" fill="none" />
    </g>
    <text x="14" y="125" fill="#00f5d4" font-family="'Courier New', monospace" font-size="8">AI SCAN: 99.2%</text>
  </g>

  <!-- Right: Insights and Metrics -->
  <g transform="translate(160, 45)">
    <rect x="0" y="0" width="200" height="155" fill="#08232c" stroke="#00f5d4" stroke-width="1" />
    <text x="15" y="25" fill="#00f5d4" font-family="'Courier New', monospace" font-size="11" font-weight="bold">> TRANSFORMING DIAGNOSIS</text>
    <text x="15" y="42" fill="#88b4be" font-family="'Courier New', monospace" font-size="8">Empower wellness with X-ray AI</text>

    <rect x="15" y="55" width="170" height="35" fill="#03151b" stroke="#00b4d8" />
    <text x="25" y="70" fill="#fff" font-family="'Courier New', monospace" font-size="9" font-weight="bold">INSTANT RADIOLOGY INSIGHTS</text>
    <text x="25" y="82" fill="#00f5d4" font-family="'Courier New', monospace" font-size="8">Detecting anomalies under 3.5s</text>

    <text x="15" y="112" fill="#fff" font-family="'Courier New', monospace" font-size="8">ROLE: Mobile UX &amp; Patient Flow</text>
    <text x="15" y="126" fill="#88b4be" font-family="'Courier New', monospace" font-size="8">SPECIALTY: Clinical Decision Support</text>
    <text x="15" y="142" fill="#ffd166" font-family="'Courier New', monospace" font-size="9" font-weight="bold">HEALTHCARE CERTIFIED</text>
  </g>
</svg>
